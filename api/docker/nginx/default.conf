server {
    listen 80;
    server_name _;

    root /app/public;
    index index.php;

    # Static files (Swagger UI assets) are served directly by nginx;
    # everything else goes to the Symfony front controller.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass gardenhub-api:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # Never execute arbitrary PHP files from public/
    location ~ \.php$ {
        return 404;
    }
}
