framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: 'doctrine://default?queue_name=async'
                retry_strategy:
                    max_retries: 3
                    delay: 60000
                    multiplier: 2
                    jitter: 0.1
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            # Route ChirpStack uplinks to the durable async transport
            'App\Mqtt\ChirpStackUplink': async

