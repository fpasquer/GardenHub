apiVersion: 1

contactPoints:
  - orgId: 1
    name: GardenHub Telegram
    receivers:
      - uid: gardenhub-telegram
        type: telegram
        disableResolveMessage: false
        settings:
          # Rendered by grafana/docker/render-provisioning.sh before Grafana's
          # own provisioning loader parses this file: Grafana coerces any
          # $VAR-substituted value that looks numeric into a JSON number
          # (crashing chatid, which must stay a string), regardless of quoting.
          chatid: "$TELEGRAM_CHAT_ID"
          bottoken: "$TELEGRAM_BOT_TOKEN"
