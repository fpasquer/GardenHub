apiVersion: 1

contactPoints:
  - orgId: 1
    name: GardenHub Telegram
    receivers:
      - uid: gardenhub-telegram
        type: telegram
        disableResolveMessage: false
        settings:
          # A block scalar keeps numeric/negative Telegram chat IDs as strings
          # when Grafana expands the environment variable during provisioning.
          chatid: |-
            $TELEGRAM_CHAT_ID
        secure_settings:
          bottoken: $TELEGRAM_BOT_TOKEN
