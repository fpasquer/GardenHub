apiVersion: 1

contactPoints:
  - orgId: 1
    name: GardenHub Telegram
    receivers:
      - uid: gardenhub-telegram
        type: telegram
        disableResolveMessage: false
        settings:
          # Rendered by grafana/render-alerting.sh before Grafana reads this file.
          # Grafana coerces numeric values substituted from $TELEGRAM_CHAT_ID.
          chatid: "__GARDENHUB_CHAT_ID__"
          bottoken: $TELEGRAM_BOT_TOKEN
