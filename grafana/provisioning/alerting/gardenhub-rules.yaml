apiVersion: 1

groups:
  - orgId: 1
    name: gardenhub-ingestion-health
    folder: GardenHub
    interval: 1m
    rules:
      - uid: gardenhub-device-silent
        title: GardenHub device silent
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: gardenhub-mysql
            model:
              datasource:
                type: mysql
                uid: gardenhub-mysql
              editorMode: code
              format: time_series
              rawQuery: true
              rawSql: |-
                SELECT
                  UTC_TIMESTAMP() AS time,
                  TIMESTAMPDIFF(
                    SECOND,
                    MAX(m.created_at),
                    UTC_TIMESTAMP()
                  ) AS value,
                  CONCAT(d.name, ' / ', s.type) AS metric
                FROM sensor s
                INNER JOIN device d ON d.id = s.device_id
                LEFT JOIN measurement m ON m.sensor_id = s.id
                GROUP BY s.id, d.name, s.type
                HAVING MAX(m.created_at) IS NOT NULL
                ORDER BY time
              refId: A
              intervalMs: 60000
              maxDataPoints: 1440
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [3600]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 60000
              maxDataPoints: 1440
              refId: B
              type: threshold
        noDataState: OK
        executionErrorState: Alerting
        for: 1m
        annotations:
          summary: >-
            No GardenHub reading stored for {{ $labels.metric }} in over 60 minutes.
          description: >-
            Check the device, LoRaWAN uplinks, MQTT connection, and GardenHub
            ingestion worker. The rule evaluates once per minute and fires after
            the stale condition remains true for one minute.
        labels:
          component: ingestion
          severity: warning
          source: grafana
        notification_settings:
          receiver: GardenHub Telegram
          group_by: [grafana_folder, alertname, metric]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
        isPaused: false

      - uid: gardenhub-no-measurements
        title: GardenHub no measurements received
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: gardenhub-mysql
            model:
              datasource:
                type: mysql
                uid: gardenhub-mysql
              editorMode: code
              format: time_series
              rawQuery: true
              rawSql: |-
                SELECT
                  UTC_TIMESTAMP() AS time,
                  COUNT(DISTINCT m.deduplication_id) AS value
                FROM measurement m
                WHERE m.created_at >= UTC_TIMESTAMP() - INTERVAL 60 MINUTE
              refId: A
              intervalMs: 60000
              maxDataPoints: 1440
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 60000
              maxDataPoints: 1440
              refId: B
              type: threshold
        noDataState: Alerting
        executionErrorState: Alerting
        for: 5m
        annotations:
          summary: No GardenHub measurements received from any device for 60 minutes.
          description: >-
            This indicates a platform-wide ingestion outage or a database query
            failure. Check ChirpStack, MQTT, gardenhub-worker, and
            gardenhub-mysql. The rule fires after the condition remains true for
            five minutes.
        labels:
          component: ingestion
          severity: critical
          source: grafana
        notification_settings:
          receiver: GardenHub Telegram
          group_by: [grafana_folder, alertname]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
        isPaused: false
