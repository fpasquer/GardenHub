name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Build and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build gardenhub-api image
        env:
          # CI-only placeholder required by root compose.yaml interpolation;
          # no root-stack container is started, so no port is actually bound.
          BIND_ADDRESS: 127.0.0.1
        run: docker build --target development -t gardenhub-api api

      - name: Build PHPUnit runner
        run: make test-build

      - name: Run migrated PHPUnit tests
        id: phpunit_tests
        continue-on-error: true
        run: make test-report

      - name: Upload PHPUnit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phpunit-results
          path: |
            .test-reports/phpunit/all/
            .test-reports/phpunit/scheduler-delivery/
            .test-reports/phpunit/telegram-summary/
            .test-reports/phpunit/sensor-identity/
            .test-reports/phpunit/sensor-concurrency/
            .test-reports/phpunit/mqtt-worker/
            .test-reports/phpunit/mqtt-session-resume/
            .test-reports/phpunit/mqtt-delivery/
            .test-reports/phpunit/mqtt-identity-race/
            .test-reports/phpunit/migration-upgrade/
            .test-reports/phpunit/watering-orm/
            .test-reports/phpunit/watering-control/
            .test-reports/phpunit/watering-production/
            .test-reports/phpunit/watering-proposals/
            .test-reports/phpunit/watering-actuator-switch/
            .test-reports/phpunit/watering-mqtt/
            .test-reports/phpunit/production-smoke/
            .test-reports/phpunit/grafana/
          if-no-files-found: error

      - name: Fail if any test suite failed
        if: always()
        run: |
          if [ "${{ steps.phpunit_tests.outcome }}" != "success" ]; then
            echo "PHPUnit tests failed"
            exit 1
          fi

  grafana:
    name: Grafana integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build offline test tooling
        run: docker build --target test-runner -t gardenhub-tests:phpunit api
      - name: Run full Grafana suite
        run: bash tests/phpunit-grafana.sh functional_gardenhub-grafana
      - name: Upload Grafana PHPUnit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grafana-phpunit
          path: .test-reports/phpunit/grafana/
          if-no-files-found: error
      - name: Show failure diagnostics
        if: failure()
        run: docker compose -f tests/grafana-db/compose.yaml -f tests/grafana-db/compose-ci.yaml logs --no-color --tail=100
      - name: Clean up Grafana stack
        if: always()
        run: docker compose -f tests/grafana-db/compose.yaml -f tests/grafana-db/compose-ci.yaml down -v --remove-orphans

  composer-audit:
    name: Composer dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Audit locked dependencies
        run: |
          mkdir -p .ci-reports
          docker run --rm -v "$PWD/api:/app:ro" -w /app composer:2 \
            audit --locked --format=json --abandoned=report > .ci-reports/composer.json
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: composer-audit
          path: .ci-reports/composer.json
          if-no-files-found: error

  production:
    name: Production image smoke and audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRODUCTION_IMAGE: gardenhub-api:${{ github.sha }}
      SMOKE_NGINX_IMAGE: gardenhub-smoke-nginx:${{ github.sha }}
      TRIVY_IMAGE: aquasec/trivy@sha256:086971aaf400beebd94e8300fd8ea623774419597169156cec56eec5b00dfb1e
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build production images
        run: |
          docker build --target production -t "$PRODUCTION_IMAGE" api
          docker build --target smoke-nginx -t "$SMOKE_NGINX_IMAGE" api
      - name: Run packaged production smoke tests
        run: |
          docker build --target test-runner -t gardenhub-tests:phpunit api
          sh tests/production-smoke/run.sh
      - name: Upload packaged smoke results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-smoke-phpunit
          path: .test-reports/phpunit/production-smoke/
          if-no-files-found: error
      - name: Scan production images
        if: ${{ !cancelled() && success() }}
        run: |
          mkdir -p .ci-reports
          docker image inspect "$PRODUCTION_IMAGE" "$SMOKE_NGINX_IMAGE" > .ci-reports/images.json
          for component in api nginx; do
            image="$PRODUCTION_IMAGE"
            if [[ "$component" == nginx ]]; then image="$SMOKE_NGINX_IMAGE"; fi
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro \
              -v "$PWD/.ci-reports:/reports" -v trivy-cache:/root/.cache/trivy \
              "$TRIVY_IMAGE" image --scanners vuln --format json \
              --output "/reports/$component.json" "$image"
          done
          python3 scripts/check-image-audit.py .ci-reports/api.json .ci-reports/nginx.json
      - name: Upload production audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-image-audit
          path: .ci-reports/
          if-no-files-found: error
      - name: Clean up production smoke stack
        if: always()
        run: docker compose -f tests/production-smoke/compose.yaml down -v --remove-orphans

  ready:
    name: CI Ready
    needs: [tests, grafana, composer-audit, production]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every release check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Release checks did not succeed: ' + ', '.join(failed))
          print('All required release checks passed.')
          PY
