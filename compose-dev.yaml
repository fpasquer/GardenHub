# Development-only services. Start the dev stack with BOTH files:
#
#   docker compose -f compose.yaml -f compose-dev.yaml up -d
#
# Production uses compose.yaml alone; source mounts and legacy credentials
# below are strictly development-only.
name: gardenhub

x-development-environment: &development-environment
  APP_ENV: dev
  APP_DEBUG: "1"
  WATERING_MQTT_HOST: ${WATERING_MQTT_HOST:-${MQTT_HOST:-}}
  WATERING_MQTT_PORT: ${WATERING_MQTT_PORT:-${MQTT_PORT:-1883}}
  WATERING_MQTT_TOPIC: ${WATERING_MQTT_TOPIC:-gardenhub/dev/watering/avocado}
  WATERING_MQTT_USERNAME: ${WATERING_MQTT_USERNAME:-${WATERING_DEV_USERNAME:-}}
  WATERING_MQTT_PASSWORD: ${WATERING_MQTT_PASSWORD:-${WATERING_DEV_PASSWORD:-}}

x-development-volumes: &development-volumes
  - ./api/bin:/app/bin:ro
  - ./api/config:/app/config:ro
  - ./api/src:/app/src:ro
  - ./api/.env:/app/.env:ro

x-development-hosts: &development-hosts
  - "host.docker.internal:172.22.0.1"

services:
  gardenhub-adminer:
    image: adminer:5
    container_name: gardenhub-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8082}:8080"
    environment:
      # Pre-fills the server field on the login form; user and password
      # are still typed manually (no credentials in the browser).
      ADMINER_DEFAULT_SERVER: gardenhub-mysql
    depends_on:
      gardenhub-mysql:
        condition: service_healthy
    networks:
      - gardenhub

  gardenhub-worker:
    environment: *development-environment
    extra_hosts: *development-hosts
    volumes: *development-volumes
    networks: !override
      - gardenhub

  gardenhub-api:
    build:
      target: development
    environment: *development-environment
    extra_hosts: *development-hosts
    volumes:
      - ./api/bin:/app/bin
      - ./api/config:/app/config
      - ./api/migrations:/app/migrations
      - ./api/public:/app/public
      - ./api/src:/app/src
      - ./api/templates:/app/templates
      - ./api/composer.json:/app/composer.json
      - ./api/composer.lock:/app/composer.lock
      - ./api/symfony.lock:/app/symfony.lock
      - ./api/.env:/app/.env
      - ./api/tests:/app/tests

  gardenhub-consumer:
    environment: *development-environment
    extra_hosts: *development-hosts
    volumes: *development-volumes
    networks: !override
      - gardenhub

  gardenhub-scheduler:
    environment: *development-environment
    extra_hosts: *development-hosts
    volumes: *development-volumes

  # Opt-in fake Zigbee2MQTT device for developing the watering workflow on
  # the Pi without a coordinator. Uses a dedicated, dev-only MQTT identity.
  gardenhub-watering-sim:
    image: gardenhub-api
    container_name: gardenhub-watering-sim
    profiles: ["watering-sim"]
    restart: unless-stopped
    command: php /tests/watering-sim/simulator.php
    environment:
      APP_ENV: dev
      WATERING_MQTT_TOPIC: ${WATERING_MQTT_TOPIC:-gardenhub/dev/watering/avocado}
      WATERING_SIM_MQTT_HOST: ${MQTT_HOST:-}
      WATERING_SIM_MQTT_PORT: ${MQTT_PORT:-1883}
      WATERING_SIM_USERNAME: ${WATERING_SIM_USERNAME:-}
      WATERING_SIM_PASSWORD: ${WATERING_SIM_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:172.22.0.1"
    volumes:
      - ./tests/watering-sim:/tests/watering-sim:ro
    networks:
      - gardenhub

  # The same monitor is used either with the simulator or, explicitly, with
  # the real Zigbee2MQTT actuator. Replace (do not append) the base profiles.
  gardenhub-watering-monitor:
    profiles: !override ["watering-sim", "watering-hardware"]
    environment: *development-environment
    extra_hosts: *development-hosts
    volumes: *development-volumes

  # Optional single long poller. No inbound port; it shares the dev bot token
  # only when no other service consumes getUpdates for that bot.
  gardenhub-watering-proposals:
    environment: *development-environment
    extra_hosts: *development-hosts
    volumes: *development-volumes

# Reference to the shared network defined in compose.yaml so the adminer
# container can reach gardenhub-mysql over the internal Docker network.
networks:
  gardenhub:
    name: gardenhub
