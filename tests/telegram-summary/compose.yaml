name: gardenhub-telegram-summary-tests

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_DATABASE: telegram_summary
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=TCP", "--silent"]
      interval: 1s
      timeout: 5s
      retries: 60

  tests:
    image: gardenhub-api
    entrypoint: ["sh", "-c", "php /tests/telegram-daily-summary.php"]
    environment:
      # The test script boots App\Kernel with the 'dev' environment (not
      # 'test'): doctrine.yaml appends a "_test" dbname suffix in the test
      # environment, which would silently point at a database this
      # disposable MySQL container never creates.
      APP_ENV: dev
      APP_DEBUG: '1'
      APP_SECRET: telegram-summary-tests-only
      DATABASE_URL: 'mysql://root@mysql:3306/telegram_summary?serverVersion=8.4&charset=utf8mb4'
      GARDENHUB_LIFECYCLE_TESTS: '1'
    volumes:
      - ../../api/src:/app/src:ro
      - ../../api/config:/app/config:ro
      - ./:/tests:ro
    depends_on:
      mysql:
        condition: service_healthy
