name: gardenhub-mqtt-lifecycle-tests

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_DATABASE: worker_lifecycle
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=TCP", "--silent"]
      interval: 1s
      timeout: 5s
      retries: 60

  mqtt:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "health", "-m", "ready"]
      interval: 1s
      timeout: 5s
      retries: 30

  tests:
    image: gardenhub-api
    entrypoint: ["sh", "-c", "php /tests/worker-lifecycle.php && php /tests/delivery-guarantees.php"]
    environment:
      APP_ENV: dev
      APP_DEBUG: '1'
      APP_SECRET: lifecycle-tests-only
      DATABASE_URL: 'mysql://root@mysql:3306/worker_lifecycle?serverVersion=8.4&charset=utf8mb4'
      GARDENHUB_LIFECYCLE_TESTS: '1'
    volumes:
      - ../../api/src:/app/src:ro
      - ../../api/config:/app/config:ro
      - ./:/tests:ro
    depends_on:
      mysql:
        condition: service_healthy
      mqtt:
        condition: service_healthy