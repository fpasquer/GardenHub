name: gardenhub-grafana-db-tests

services:
  # Named gardenhub-mysql to match the hostname hardcoded in the real,
  # unmodified grafana/provisioning/datasources/mysql.yaml.
  gardenhub-mysql:
    image: mysql:8.4
    command: ["--mysql-native-password=ON", "--authentication-policy=mysql_native_password", "--innodb-buffer-pool-size=32M", "--innodb-log-buffer-size=4M", "--max-connections=20", "--table-open-cache=64", "--table-definition-cache=400", "--temptable-max-ram=16M"]
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_DATABASE: gardenhub
    volumes:
      - database:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=TCP", "--silent"]
      interval: 2s
      timeout: 5s
      retries: 60

  # Real, pinned Grafana image loading this repo's actual provisioning files
  # unmodified (same bind-mount shape as compose.yaml's gardenhub-grafana),
  # so a passing test here reflects the real dev/prod deployment.
  grafana:
    image: grafana/grafana:12.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GOMEMLIMIT: 192MiB
      GOGC: '50'
      MYSQL_DATABASE: gardenhub
      MYSQL_USER: root
      MYSQL_PASSWORD: ''
      # Synthetic, non-secret, but same shape as real Telegram credentials
      # (numeric chat id, colon-delimited bot token) to exercise provisioning.
      TELEGRAM_BOT_TOKEN: '123456789:TEST-not-a-real-token-AAAAAAAAAAAAAAAAAAAA'
      TELEGRAM_CHAT_ID: '987654321'
    entrypoint: ["/bin/sh", "/docker-entrypoint-scripts/render-provisioning.sh"]
    volumes:
      - ../../grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../../grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../../grafana/provisioning/alerting:/etc/grafana/provisioning-templates/alerting:ro
      - ../../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ../../grafana/docker/render-provisioning.sh:/docker-entrypoint-scripts/render-provisioning.sh:ro
    depends_on:
      gardenhub-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 90

  tests:
    image: gardenhub-tests:phpunit
    entrypoint: ["timeout", "-s", "TERM", "-k", "10", "2400", "php", "vendor/bin/phpunit"]
    command: ["--do-not-record-test-run-history", "--testdox", "--display-all-issues", "--group", "${GARDENHUB_GRAFANA_GROUP:-functional_gardenhub-grafana}", "--log-junit", "/reports/junit.xml", "--testdox-text", "/reports/testdox.txt", "tests/Integration"]
    environment:
      XDEBUG_MODE: 'off'
      GARDENHUB_GRAFANA_TESTS: '1'
      GARDENHUB_ROOT: /workspace
      GRAFANA_URL: http://grafana:3000
      GRAFANA_USER: admin
      GRAFANA_PASSWORD: admin
      MYSQL_HOST: gardenhub-mysql
    volumes:
      - ./:/tests:ro
      - ../..:/workspace:ro
      - ../../api/tests:/app/tests:ro
      - ../../api/phpunit.xml.dist:/app/phpunit.xml.dist:ro
      - ../../.test-reports/phpunit/grafana:/reports
    depends_on:
      grafana:
        condition: service_healthy

volumes:
  database:
