# Loaded ONLY by MarkerRollbackKernel in tests/telegram-alerts/marker-rollback.php.
# Shortens the async retry delay so the injected marker-flush failure is
# retried promptly in-process during the test. Production retry settings in
# api/config/packages/messenger.yaml are untouched.
framework:
    messenger:
        transports:
            async:
                retry_strategy:
                    max_retries: 3
                    delay: 100
                    multiplier: 1
                    jitter: 0.0
