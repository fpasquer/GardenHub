name: gardenhub

x-application-environment: &application-environment
  APP_ENV: ${APP_ENV:-prod}
  APP_DEBUG: "0"
  DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@gardenhub-mysql:3306/${MYSQL_DATABASE}?serverVersion=8.4&charset=utf8mb4"
  MQTT_CLIENT_ID: ${MQTT_CLIENT_ID}
  TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  TELEGRAM_MIN_LEVEL: ${TELEGRAM_MIN_LEVEL:-warning}
  WATERING_ENABLED: ${WATERING_ENABLED:-false}
  WATERING_MQTT_HOST: ${WATERING_MQTT_HOST:-}
  WATERING_MQTT_PORT: ${WATERING_MQTT_PORT:-1883}
  WATERING_MQTT_TOPIC: ${WATERING_MQTT_TOPIC:-}
  WATERING_MQTT_USERNAME: ${WATERING_MQTT_USERNAME:-}
  WATERING_MQTT_PASSWORD: ${WATERING_MQTT_PASSWORD:-}
  WATERING_MAX_SECONDS: ${WATERING_MAX_SECONDS:-30}
  WATERING_DAILY_SECONDS: ${WATERING_DAILY_SECONDS:-120}
  WATERING_COOLDOWN_SECONDS: ${WATERING_COOLDOWN_SECONDS:-60}
  WATERING_PROPOSAL_THRESHOLD: ${WATERING_PROPOSAL_THRESHOLD:-15}
  WATERING_PROPOSAL_FRESHNESS_MINUTES: ${WATERING_PROPOSAL_FRESHNESS_MINUTES:-35}
  WATERING_PROPOSAL_MAX_GAP_MINUTES: ${WATERING_PROPOSAL_MAX_GAP_MINUTES:-35}
  WATERING_PROPOSAL_VALIDITY_MINUTES: ${WATERING_PROPOSAL_VALIDITY_MINUTES:-30}
  WATERING_PROPOSAL_DURATION_SECONDS: ${WATERING_PROPOSAL_DURATION_SECONDS:-3}
  WATERING_TELEGRAM_USER_ID: ${WATERING_TELEGRAM_USER_ID:-}
  WATERING_TELEGRAM_CHAT_ID: ${WATERING_TELEGRAM_CHAT_ID:-}

services:
  gardenhub-nginx:
    image: nginx:1.30.5-alpine
    container_name: gardenhub-nginx
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:?BIND_ADDRESS must be set}:${APP_PORT:-8080}:80"
    volumes:
      # public/ is shared read-only: nginx serves static assets and the
      # path must match the api container for SCRIPT_FILENAME resolution.
      - ./api/public:/app/public:ro
      - ./api/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gardenhub-api:
        condition: service_healthy
    healthcheck:
      # End-to-end check: nginx → PHP-FPM → Symfony → Doctrine → MySQL.
      # 127.0.0.1 is used instead of localhost: in this container localhost
      # resolves to IPv6 ::1 while nginx only listens on IPv4.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - gardenhub

  gardenhub-api:
    build:
      context: ./api
      target: production
    image: gardenhub-api
    container_name: gardenhub-api
    restart: unless-stopped
    environment: *application-environment
    depends_on:
      gardenhub-mysql:
        condition: service_healthy
    healthcheck:
      # PHP-FPM liveness only, runs as root; gardenhub-nginx's /healthz is the
      # real app+DB check and never boots Symfony here. $$ escapes Compose's
      # own interpolation so PHP sees literal $errno/$errstr, not env vars.
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000, $$errno, $$errstr, 2) ? 0 : 1);"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s
    networks:
      - gardenhub

  gardenhub-worker:
    image: gardenhub-api
    container_name: gardenhub-worker
    restart: unless-stopped
    # tty so Monolog's console handler (which checks posix_isatty(STDERR))
    # actually writes to the container logs — without it
    # `docker compose logs gardenhub-worker` stays empty.
    tty: true
    command: php bin/console gardenhub:mqtt:consume
    environment:
      <<: *application-environment
      MQTT_HOST: ${MQTT_HOST}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    depends_on:
      gardenhub-api:
        condition: service_healthy
      gardenhub-mysql:
        condition: service_healthy
    healthcheck:
      # The consumer is a long-running CLI process (no HTTP port).
      test: ["CMD-SHELL", "pgrep -f 'gardenhub:mqtt:consume' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - gardenhub
      - iot-lan

  gardenhub-consumer:
    image: gardenhub-api
    container_name: gardenhub-consumer
    restart: unless-stopped
    tty: true
    command: php bin/console messenger:consume async --time-limit=3600
    environment: *application-environment
    depends_on:
      gardenhub-api:
        condition: service_healthy
      gardenhub-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'messenger:consume async' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - gardenhub

  # Runs the Symfony Scheduler's "default" schedule, which dispatches the
  # `gardenhub:telegram:daily-summary` command every day at 22:00 UTC (see
  # the #[AsCronTask] attribute on TelegramDailySummaryCommand). Opt-in via
  # `docker compose --profile scheduler up -d gardenhub-scheduler`; it is
  # not started by a plain `docker compose up`.
  gardenhub-scheduler:
    image: gardenhub-api
    container_name: gardenhub-scheduler
    restart: unless-stopped
    tty: true
    user: www-data
    profiles: ["scheduler"]
    command: php bin/console messenger:consume scheduler_default --no-interaction -v
    environment: *application-environment
    depends_on:
      gardenhub-api:
        condition: service_healthy
      gardenhub-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'messenger:consume scheduler_default' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - gardenhub

  gardenhub-watering-monitor:
    image: gardenhub-api
    container_name: gardenhub-watering-monitor
    profiles: ["watering-hardware"]
    restart: unless-stopped
    command: php bin/console gardenhub:watering:monitor --no-debug
    environment: *application-environment
    depends_on:
      gardenhub-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '^php bin/console gardenhub:watering:monitor' >/dev/null && php bin/console gardenhub:watering:check --monitor --no-debug"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - gardenhub

  gardenhub-watering-proposals:
    image: gardenhub-api
    container_name: gardenhub-watering-proposals
    profiles: ["watering-proposals"]
    restart: unless-stopped
    command: php bin/console gardenhub:watering:proposals --no-debug
    environment: *application-environment
    depends_on:
      gardenhub-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '^php bin/console gardenhub:watering:proposals' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - gardenhub

  gardenhub-mysql:
    image: mysql:8.4
    container_name: gardenhub-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    # MySQL is intentionally not exposed to the host network. It is only
    # reachable from the gardenhub Docker network. Use
    # `docker compose exec gardenhub-mysql mysql -uroot -p` to access it.
    volumes:
      - gardenhub-mysql-data:/var/lib/mysql
    healthcheck:
      # Note: $$ escapes to a single $ so Compose does not interpolate it;
      # MYSQL_ROOT_PASSWORD is read inside the container at runtime.
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - gardenhub

  gardenhub-grafana:
    image: grafana/grafana:12.1
    container_name: gardenhub-grafana
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:?BIND_ADDRESS must be set}:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Local-first: no usage reports, update checks or external calls.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      # Passed through so the provisioned MySQL datasource can use them.
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${GRAFANA_MYSQL_USER}
      MYSQL_PASSWORD: ${GRAFANA_MYSQL_PASSWORD}
      # Use the same bot and destination as Symfony's Telegram notifications.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    entrypoint: ["/bin/sh", "/docker-entrypoint-scripts/render-provisioning.sh"]
    volumes:
      - gardenhub-grafana-data:/var/lib/grafana
      # Datasources and dashboards are provisioned as-is; alerting is
      # rendered from templates first (see render-provisioning.sh) so
      # Telegram's chatid never passes through Grafana's own $VAR expansion.
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning-templates/alerting:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/docker/render-provisioning.sh:/docker-entrypoint-scripts/render-provisioning.sh:ro
    depends_on:
      gardenhub-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - gardenhub

volumes:
  gardenhub-mysql-data:
    name: gardenhub-mysql-data
  gardenhub-grafana-data:
    name: gardenhub-grafana-data

networks:
  gardenhub:
    name: gardenhub
    # Pinned subnet so the gateway is ALWAYS 172.22.0.1. Without this,
    # Docker picks a free subnet at network-creation time and the
    # host.docker.internal extra_hosts mapping (gardenhub-worker) would
    # silently go stale after a network recreate / Docker restart.
    ipam:
      config:
        - subnet: 172.22.0.0/16
  iot-lan:
    external: true
    name: iot_iot-lan
